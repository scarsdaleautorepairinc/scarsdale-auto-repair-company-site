# Include INSIDE the existing fleettsolutions.com HTTPS server block.
# Install the frontend build at /var/www/repair-shop/.
location /repair-shop/api/ {
    client_max_body_size 25m;
    proxy_pass http://127.0.0.1:8091/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location /repair-shop/ {
    root /var/www;
    try_files $uri $uri/ /repair-shop/index.html;
}
